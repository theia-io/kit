<ul class="flex flex-col space-y-4">
  <li>
    <strong class="block text-xs font-semibold uppercase">Support</strong>

    <ul>
      <li>
        <a
          [routerLink]="introducingKitFarewell()"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl">
          Explore product
          <i class="pi pi-external-link ml-1 text-xs helper"></i>
        </a>
      </li>
      <li>
        <a
          [href]="
            'mailto:info@kitouch.io?subject=kitouch support&body=%0D%0A%0D%0A========%0A%0AExtra Information (for kitouch.io):%0A - version: ' +
            environment.build
          "
          target="_blank"
          pTooltip="Write us email to info@kitouch.io"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl">
          Email us
          <i class="pi pi-external-link ml-1 text-xs helper"></i>
          <img
            ngSrc="/material-icons/mail.svg"
            alt="Email us, external link"
            class="ml-auto"
            width="20"
            height="20" />
        </a>
      </li>
    </ul>
  </li>

  <li>
    <strong class="block text-xs font-semibold uppercase">Experience</strong>

    <ul>
      <li>
        <a
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="navbarService.triggerPrimengHighlight$$.next()"
          [routerLink]="offboardingUrl()"
          routerLinkActive="bg-slate-200 rounded text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }">
          All Offboardings
        </a>
      </li>

      <li>
        <a
          role="button"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="createOffboardingHandler()">
          New Experience
          <i class="pi pi-external-link ml-1 text-xs helper"></i>
          <i class="pi pi-heart-fill ml-auto"></i>
        </a>
      </li>
    </ul>
  </li>

  <li>
    <strong class="block text-xs font-semibold uppercase">Features</strong>

    <ul>
      <li>
        <a
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="navbarService.triggerPrimengHighlight$$.next()"
          [routerLink]="farewellUrl()"
          routerLinkActive="bg-slate-200 rounded text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }">
          All farewells
        </a>
      </li>

      <li>
        <a
          role="button"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="createFarewellHandler()">
          New Farewell
          <i class="pi pi-external-link ml-1 text-xs helper"></i>
          <i class="pi pi-file-edit ml-auto"></i>
        </a>
      </li>
    </ul>

    <ul>
      <li>
        <a
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="navbarService.triggerPrimengHighlight$$.next()"
          [routerLink]="kudoBoardUrl()"
          routerLinkActive="bg-slate-200 rounded text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }">
          All kudo boards
        </a>
      </li>

      <li>
        <a
          role="button"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="createKudoBoardHandler()">
          New Kudo board
          <i class="pi pi-external-link ml-1 text-xs helper"></i>
          <i class="pi pi-sparkles ml-auto"></i>
        </a>
      </li>
    </ul>
  </li>

  <li>
    <strong class="block text-xs font-semibold uppercase">Profile</strong>
    <ul class="space-y-1">
      <!-- TODO Implement better suggestion mechanism -->
      <!-- <li>
        <a
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          [routerLink]="suggestionUrl()"
          routerLinkActive="bg-slate-200 rounded text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }">
          Find colleagues
        </a>
      </li> -->
      <li>
        <a
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="navbarService.triggerPrimengHighlight$$.next()"
          [routerLink]="profileSettingsUrl()"
          routerLinkActive="bg-slate-200 rounded text-gray-900"
          [routerLinkActiveOptions]="{ exact: true }">
          Settings
        </a>
      </li>
      <li>
        <a
          role="button"
          uiKitSmallTextTailwindClasses
          class="flex items-center w-full px-4 py-2 transition hover:shadow-xl"
          (click)="
            navbarService.triggerPrimengHighlight$$.next(); logout.emit()
          ">
          Logout
          <i class="pi pi-sign-out ml-auto"></i>
        </a>
      </li>
    </ul>
  </li>

  <li class="mt-12 block">
    <ul class="space-y-1">
      <li>
        <shared-static-info />
      </li>
    </ul>
  </li>
</ul>
