@if(quill(); as quill) {
<shared-quill-side-actions
  [(show)]="sideActionsShow"
  [bounds]="sideActionsBounds()"
  (sideActionOpened)="sideActionOpened.set($event)"
  (divider)="dividerHandler(quill)"
  (imageFiles)="imageFilesHandler(quill, $event)"></shared-quill-side-actions>
<shared-quill-actions
  [(show)]="actionsShow"
  [bounds]="actionsBounds()"
  [quill]="quill"></shared-quill-actions>
}

<p-editor
  [formControl]="editorControl"
  aria-describedby="farewell-rich-text-editor"
  [placeholder]="editorPlaceholder()"
  [modules]="{}"
  [style]="{
    border: 'none',
    fontFamily: 'var(--font-family)'
  }"
  styleClass="w-full h-full custom-toolbar text-xl"
  (onInit)="quillInit($event)"
  (onTextChange)="onTextChangeHandler($event)"
  (onSelectionChange)="selectionChangeHandler($event)">
  <p-header></p-header>
</p-editor>

<br />
