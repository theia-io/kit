<div class="flex gap-1 md:gap-2 items-center">
  <feat-offboarding-status [status]="offboarding().status" />

  @let offboardingCreatedAt = offboarding().createdAt; @let offboardingUpdatedAt
  = offboarding().updatedAt;

  <p class="text-sm text-gray-500">
    <i
      class="pi pi-calendar mr-1"
      [pTooltip]="
        (offboardingCreatedAt
          ? 'Created on ' + (offboardingCreatedAt | date)
          : '') +
        (showUpdatedDate()
          ? offboardingUpdatedAt
            ? (!!offboardingCreatedAt ? '\n' : '') +
              'Updated on ' +
              (offboardingUpdatedAt | date)
            : ''
          : '')
      "></i>
    {{ offboardingCreatedAt ?? offboardingUpdatedAt | date }},
  </p>

  <feat-offboarding-analytics
    [offboardingId]="offboarding().id"
    [preview]="preview()" />
</div>
